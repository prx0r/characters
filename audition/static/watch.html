<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Watch — Pogtown stage</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#eee;font-family:system-ui,sans-serif;overscroll-behavior:none}
#feed{height:100vh;overflow-y:scroll;scroll-snap-type:y mandatory}
.card{height:100vh;scroll-snap-align:start;display:flex;justify-content:center;background:#000}
.col{position:relative;width:min(100vw,calc(100vh*9/16));height:100vh;overflow:hidden;background:radial-gradient(circle at 50% 30%,#2b2010,#000 72%)}
.bg{position:absolute;inset:-5%;width:110%;height:110%;object-fit:cover;filter:blur(28px) brightness(.4);pointer-events:none}
.stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.stage svg{width:96%;max-height:88%}
.sub{position:absolute;left:8px;right:64px;bottom:86px;text-align:center;font-size:26px;font-weight:800;line-height:1.25;
color:#fff;text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 0 12px #000;pointer-events:none}
.topmeta{position:absolute;top:44px;left:12px;right:12px;color:#ddd;font-size:13px;text-shadow:0 1px 4px #000}
.prog{position:absolute;bottom:0;left:0;right:0;height:4px;background:#333}
.prog>div{height:100%;width:0%;background:#facc15}
.rail{position:absolute;right:8px;bottom:110px;display:flex;flex-direction:column;gap:14px;z-index:3}
.rail button{font-size:24px;background:rgba(0,0,0,.5);border:1px solid #555;color:#eee;border-radius:50%;width:52px;height:52px}
.rail button.on{background:#166534}
#top{position:fixed;top:0;left:0;right:0;display:flex;gap:10px;padding:10px;z-index:5;font-size:14px}
#top a{color:#facc15;text-decoration:none;background:rgba(0,0,0,.6);padding:6px 10px;border-radius:8px}
#tap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.72);z-index:9;font-size:24px;cursor:pointer;text-align:center}
.hint{text-align:center;color:#777;font-size:13px;padding:8px}
</style>
</head>
<body>
<div id="top"><a href="/">Audition</a><a href="/shorts">Shorts sim</a><a href="/arena">Arena</a><span id="count"></span></div>
<div id="tap">Tap to watch ▶<br><span style="font-size:14px;color:#aaa">unlocks sound + puppet</span></div>
<div id="feed"></div>
<script>
let CARDS=[],IDX=-1,T0=0,TLS={},STARTED=false;
const $=id=>document.getElementById(id);
async function api(m,u,b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});return r.json();}
function watchMs(){return Math.round(performance.now()-T0);}
async function send(aud,decision,comment){return api('POST','/api/shorts/event',{audition_id:aud,watch_ms:watchMs(),decision,comment:comment||''});}
function puppetSVG(){return `<svg viewBox="0 0 220 300" style="background:transparent">
<defs><linearGradient id="spot" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffdf9e" stop-opacity=".28"/><stop offset="1" stop-color="#ffdf9e" stop-opacity="0"/></linearGradient></defs>
<rect x="0" y="0" width="26" height="300" fill="#5b1414"/><rect x="194" y="0" width="26" height="300" fill="#5b1414"/>
<rect x="22" y="0" width="6" height="300" fill="#3d0d0d"/><rect x="192" y="0" width="6" height="300" fill="#3d0d0d"/>
<polygon points="70,0 150,0 190,300 30,300" fill="url(#spot)"/>
<rect x="0" y="252" width="220" height="48" fill="#151020"/>
<ellipse cx="110" cy="278" rx="60" ry="10" fill="#000" opacity=".5"/>
<text class="CAMT" x="30" y="18" fill="#999" font-size="12">medium</text>
<g class="PB"><rect class="SUIT" x="60" y="170" width="100" height="100" rx="14" fill="#2b3440"/><rect x="100" y="170" width="20" height="100" fill="#e8e4d8"/><polygon points="110,185 118,205 110,235 102,205" fill="#7c1f1f"/></g>
<g class="PH"><ellipse class="SKIN" cx="110" cy="120" rx="52" ry="58" fill="#6b8f5e"/><ellipse cx="110" cy="120" rx="52" ry="58" fill="none" stroke="#2c3a26" stroke-width="3"/>
<g class="ACC"></g>
<rect class="BL" x="70" y="82" width="30" height="7" rx="3" fill="#2c3a26"/><rect class="BR" x="120" y="82" width="30" height="7" rx="3" fill="#2c3a26"/>
<ellipse cx="85" cy="112" rx="14" ry="16" fill="#f4f1e4"/><ellipse class="PL" cx="85" cy="113" rx="5" ry="9" fill="#111"/>
<ellipse cx="135" cy="112" rx="14" ry="16" fill="#f4f1e4"/><ellipse class="PR" cx="135" cy="113" rx="5" ry="9" fill="#111"/>
<ellipse class="MO" cx="110" cy="160" rx="16" ry="5" fill="#1a0f0f"/></g>
<g class="MIC"><rect x="107" y="205" width="6" height="75" rx="3" fill="#0c0c0c"/><ellipse cx="110" cy="282" rx="16" ry="4" fill="#0c0c0c"/><circle cx="110" cy="196" r="13" fill="#1f2937"/><circle cx="110" cy="196" r="13" fill="none" stroke="#4b5563" stroke-width="2"/><line x1="100" y="192" x2="120" y="192" stroke="#4b5563" stroke-width="1"/><line x1="100" y="197" x2="120" y="197" stroke="#4b5563" stroke-width="1"/><line x1="101" y="202" x2="119" y="202" stroke="#4b5563" stroke-width="1"/></g>
<text class="EX" x="110" y="294" text-anchor="middle" fill="#facc15" font-size="14">deadpan</text></svg>`;}
function applyEv(card,ev){const q=s=>card.querySelector(s);
if(ev.kind==='expression'){card.querySelector('.EX').textContent=ev.id;const mad=ev.id==='annoyed';
q('.BL').setAttribute('transform',mad?'rotate(-12 85 85)':'');q('.BR').setAttribute('transform',mad?'rotate(12 135 85)':'');}
if(ev.kind==='camera'){const t=q('.CAMT');t&&(t.textContent=ev.id);const sc={wide:.85,medium:1,closeup:1.35,pushin:1.2}[ev.id]||1;
q('.PH').setAttribute('transform',`translate(110 120) scale(${sc}) translate(-110 -120)`);}
if(ev.kind==='gesture'){if(ev.id==='eye_glitch'){['.PL','.PR'].forEach(s=>{q(s).setAttribute('rx','2');q(s).setAttribute('fill','#b91c1c');});
card.querySelector('.EX').textContent='SLIT.';setTimeout(()=>['.PL','.PR'].forEach(s=>{q(s).setAttribute('rx','5');q(s).setAttribute('fill','#111');}),900);}
if(ev.id==='suit_adjust'){q('.PB').setAttribute('transform','translate(-6 0)');setTimeout(()=>q('.PB').setAttribute('transform','translate(6 0)'),250);setTimeout(()=>q('.PB').setAttribute('transform',''),600);}
if(ev.id==='warm_rock_lean'){q('.PH').setAttribute('transform','translate(0 20)');setTimeout(()=>q('.PH').setAttribute('transform',''),1400);}
if(ev.id==='head_tilt'){q('.PH').setAttribute('transform','rotate(8 110 120)');setTimeout(()=>q('.PH').setAttribute('transform',''),700);}}
if(ev.kind==='hold'){card.querySelector('.EX').textContent='…';}}
function chunks(text,n){const w=text.split(/\s+/);if(w.length<=n)return [text];const out=[];for(let i=0;i<w.length;i+=n)out.push(w.slice(i,i+n).join(' '));return out;}
function reskin(card,svg){if(!svg)return;const q=s=>card.querySelector(s);
if(svg.skin)q('.SKIN').setAttribute('fill',svg.skin);
if(svg.suit)q('.SUIT').setAttribute('fill',svg.suit);
const acc=q('.ACC');if(!acc)return;const a=svg.accessory||'none';
if(a==='cap')acc.innerHTML='<rect x="62" y="66" width="96" height="20" rx="10" fill="#1f3a5f"/><rect x="140" y="72" width="30" height="10" rx="5" fill="#1f3a5f"/>';
else if(a==='crown')acc.innerHTML='<polygon points="70,72 82,44 96,68 110,40 124,68 138,44 150,72" fill="#b8860b"/>';
else if(a==='bolt')acc.innerHTML='<polygon points="128,30 112,58 122,58 110,86 134,56 124,56" fill="#ffd700"/>';
else acc.innerHTML='';}
async function ensureTL(c){if(TLS[c.audition_id])return TLS[c.audition_id];
try{const r=await api('GET','/api/stage/rigs');const rig=(r.rigs||[]).find(x=>x.character_id===c.character_id);
if(!rig)return null;const d=await api('POST','/api/stage/direct/'+c.audition_id,{rig_id:rig.rig_id,stage_id:'comedy_club'});
if(d.error)return null;TLS[c.audition_id]={tl:d,fired:new Set()};return TLS[c.audition_id];}catch(e){return null;}}
async function load(){const d=await api('GET','/api/shorts/feed');CARDS=d.cards||[];$('count').textContent=CARDS.length+' episodes';
CARDS.forEach(c=>c.beats.forEach(b=>b._ch=chunks(b.text,6)));
const f=$('feed');f.innerHTML=CARDS.map((c,i)=>`<div class="card" data-i="${i}"><div class="col">
${c.portrait_url?`<img class="bg" src="${c.portrait_url}">`:''}
<div class="stage"><span class="pup" style="width:100%;display:flex;justify-content:center">${puppetSVG()}</span></div>
<div class="topmeta"><b>${c.character_id}</b> · ${c.scenario_id}</div>
<div class="sub"></div><div class="prog"><div></div></div>
<audio src="${c.audio_url}" preload="auto"></audio>
<div class="rail"><button data-a="like">♥</button><button data-a="replay">↻</button><button data-a="skip">⏭</button><button data-a="mp4" title="download MP4">⬇</button></div></div></div>`).join('')
||'<div class="hint">no episodes — generate minutes first</div>';
f.querySelectorAll('.card').forEach(card=>{const i=+card.dataset.i,c=CARDS[i],aud=card.querySelector('audio');
card.querySelectorAll('.rail button').forEach(b=>b.onclick=async e=>{e.stopPropagation();const a=b.dataset.a;
if(a==='replay'&&aud){aud.currentTime=0;aud.play();return;}
if(a==='mp4'){b.textContent='…';const l=document.createElement('a');l.href='/mp4/'+c.audition_id;l.download=c.audition_id+'.mp4';document.body.appendChild(l);l.click();l.remove();b.textContent='⬇';return;}
await send(c.audition_id,a);b.classList.add('on');if(a==='skip')next();});
aud.onplay=()=>{T0=performance.now();};
aud.ontimeupdate=()=>{const ms=aud.currentTime*1000;
const beat=c.beats.find(b=>ms>=b.start_ms&&ms<=b.end_ms);
if(beat){const frac=(ms-beat.start_ms)/Math.max(1,beat.end_ms-beat.start_ms);
const ch=beat._ch[Math.min(beat._ch.length-1,Math.floor(frac*beat._ch.length))];
const sub=card.querySelector('.sub');if(sub.textContent!==ch)sub.textContent=ch;}
card.querySelector('.prog>div').style.width=(aud.duration?ms/(aud.duration*1000)*100:0)+'%';
const T=TLS[c.audition_id];if(T){T.tl.events.forEach((e,ei)=>{const k=c.audition_id+ei;
if(ms>=e.t&&!T.fired.has(k)){T.fired.add(k);try{applyEv(card,e);}catch(err){}}});}
const mo=card.querySelector('.MO');if(mo){const hold=T&&T.tl.events.some(e=>e.kind==='hold'&&ms>=e.t&&ms<=e.t+(e.ms||0));
const SHRY={AI:10,E:6,O:9,U:5,FV:3,L:5,MBP:2,rest:2,open:11,closed:1};
const mouthEv=T&&T.tl.mouth&&T.tl.mouth.events;
let shape=null;
if(mouthEv&&mouthEv.length){for(let i=mouthEv.length-1;i>=0;i--){if(ms>=mouthEv[i].t){shape=mouthEv[i].shape;break;}}}
if(shape)mo.setAttribute('ry',hold?2:(SHRY[shape]??4));
else mo.setAttribute('ry',(!aud.paused&&!hold)?(4+6*Math.abs(Math.sin(ms/130))):2);}};
aud.onended=async()=>{await send(c.audition_id,'complete');next();};
aud.addEventListener('seeked',()=>{const T=TLS[c.audition_id];if(!T)return;const ms=aud.currentTime*1000;
const keep=new Set();T.tl.events.forEach((e,ei)=>{if(e.t<=ms)keep.add(c.audition_id+ei);});T.fired=keep;});});
const io=new IntersectionObserver(es=>es.forEach(async e=>{const card=e.target,i=+card.dataset.i,c=CARDS[i],aud=card.querySelector('audio');
if(e.intersectionRatio>=0.7){IDX=i;T0=performance.now();await ensureTL(c);
if(!card.dataset.skinned){card.dataset.skinned='1';try{const ch=await api('GET','/api/stage/character/'+c.character_id);if(ch.rig&&ch.rig.svg)reskin(card,ch.rig.svg);}catch(err){}}
if(aud&&aud.paused&&STARTED)aud.play().catch(()=>{});}
else if(aud&&!aud.paused){aud.pause();send(c.audition_id,'skip');}}),{root:f,threshold:[0.7]});
f.querySelectorAll('.card').forEach(x=>io.observe(x));}
function next(){const f=$('feed');f.scrollTo({top:(IDX+1)*window.innerHeight,behavior:'smooth'});}
document.addEventListener('keydown',e=>{if(e.key==='ArrowDown')next();});
$('tap').onclick=()=>{STARTED=true;$('tap').style.display='none';const a=document.querySelector('.card audio');a&&a.play().catch(()=>{});};
load();
</script>
</body>
</html>
