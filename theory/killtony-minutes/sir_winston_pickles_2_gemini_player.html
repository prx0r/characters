function apply(ev){

// Ralph mouth shape → SVG ellipse params (ry, rx, cy)
const MOUTH={closed:[3,14,160],rest:[5,16,160],AI:[12,18,158],E:[8,17,159],
  O:[10,12,159],U:[7,10,160],FV:[4,15,160],L:[7,15,159],MBP:[2,13,160],open:[14,20,157]};
function applyViseme(ms){
  if(!VISEMES.length)return;
  // binary search for current viseme
  let lo=0,hi=VISEMES.length-1,cur=VISEMES[0];
  while(lo<=hi){
    const mid=(lo+hi)>>1;
    if(VISEMES[mid].t<=ms){cur=VISEMES[mid];lo=mid+1;}
    else hi=mid-1;
  }
  const p=MOUTH[cur.shape]||MOUTH.rest;
  const mo=q('.MO');
  if(mo){
    mo.setAttribute('ry',p[0]);
    mo.setAttribute('rx',p[1]);
    mo.setAttribute('cy',p[2]);
  }
}

function tick(){
  if(!playing)return;
  tpos = performance.now()-t0;
  if(tpos>=DUR){tpos=DUR;stop();}
  q('#barfill').style.width=(tpos/DUR*100)+'%';
  q('#scrub').value=tpos;
  const secs=Math.floor(tpos/1000);
  q('#clock').textContent=`${Math.floor(secs/60)}:${String(secs%60).padStart(2,'0')} / ${Math.floor(DUR/60000)}:${String(Math.floor(DUR/1000)%60).padStart(2,'0')}`;
  // fire events whose t <= tpos
  for(const ev of EVENTS){
    if(ev._f)continue;
    if(ev.t<=tpos){ev._f=1;apply(ev);}
  }
  // viseme mouth animation
  applyViseme(tpos);
  // current segment HUD
  const seg=segAt(tpos);
  if(seg){
    q('#emotion').textContent=seg.emotion||'—';
    q('#beat').textContent=seg.beat_type||'—';
    q('#seg').textContent=(seg.text_hint||'').slice(0,80);
  }
  raf=requestAnimationFrame(tick);
}
function play(){
  playing=true;
  // reset one-shots
  EVENTS.forEach(e=>e._f=0);
  t0=performance.now()-tpos;
  q('#play').textContent='⏸ Pause';
  raf=requestAnimationFrame(tick);
}
function stop(){
  playing=false;cancelAnimationFrame(raf);
  q('#play').textContent='▶ Play';
}
q('#play').onclick=()=>playing?stop():play();
q('#scrub').oninput=e=>{
  tpos=+e.target.value;
  EVENTS.forEach(e=>e._f=0);
  for(const ev of EVENTS){if(ev.t<=tpos){ev._f=1;apply(ev);}}
  applyViseme(tpos);
  q('#barfill').style.width=(tpos/DUR*100)+'%';
};
// anger banner
const ang=GEM.anger||{};
if(ang.present){
  const el=q('#anger');
  el.style.display='block';
  el.textContent=`anger: ${ang.type} — ${(ang.body_signature||[]).join('; ')}`;
}
</script></body></html>
